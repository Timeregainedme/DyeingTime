# Staging UI + API, bound to loopback only. Production traffic never uses this vhost.
server {
    listen 127.0.0.1:7802;
    server_name _;
    root /srv/dyeingtime/current/front/dist;
    index index.html;

    location = /env.js {
        add_header Cache-Control "no-store" always;
        default_type application/javascript;
        return 200 'window.__ENV = window.__ENV || {}; window.__ENV.BACKEND_URL = ""; window.__ENV.GENERATION_QUOTA_SCOPE = "staging-internal"; window.__ENV.GOOGLE_CLIENT_ID = "";';
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }
    location / { try_files $uri $uri/ /index.html; }
}
