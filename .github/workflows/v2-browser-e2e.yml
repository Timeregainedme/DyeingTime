name: V2 Browser E2E

# P8：本地 Chromium 系统库不完整时，由此工作流提供可重复的 Node 22 + Playwright 环境。
# 当前工作台 E2E 使用 VITE_USE_MOCK=true；真实后端数据库 E2E 仍需要独立的 MySQL/Redis 测试环境。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'front/**'
      - '.github/workflows/v2-browser-e2e.yml'

jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm test:e2e
